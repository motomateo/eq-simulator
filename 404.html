<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Pagină inexistentă · Simulator de cutremur</title>
    <!-- /eq-simulator/ is replaced by scripts/build_site.py with the site base (Pages serves this file on any path) -->
    <style>
      @font-face {
        font-family: "Montserrat";
        src: url("/eq-simulator/fonts/Montserrat-latin-ext.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("/eq-simulator/fonts/Montserrat-latin.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329;
      }
      :root {
        --bg: #f7f7f7;
        --ink: #000000;
        --muted: #5f5f5f;
        --logo: url("/eq-simulator/brand/rerise-logo-light.png");
        --rr-yellow: #ffc84a;
        --rr-orange: #ed962b;
        --rr-orange-hover: #d97f18;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f0900;
          --ink: #f7f7f7;
          --muted: #c4b8ad;
          --logo: url("/eq-simulator/brand/rerise-logo-dark.png");
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font:
          500 16px/1.5 Montserrat,
          system-ui,
          "Segoe UI",
          sans-serif;
        padding: 20px;
      }
      main {
        max-width: 480px;
      }
      .mark {
        width: 110px;
        height: 80px;
        background: var(--logo) left center / contain no-repeat;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 32px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.01em;
        margin: 0 0 12px;
        padding-left: 14px;
        border-left: 8px solid var(--rr-yellow);
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      a.go {
        display: inline-block;
        background: var(--rr-orange);
        color: #000;
        font-weight: 700;
        text-decoration: none;
        padding: 12px 18px;
        border-radius: 2px;
      }
      a.go:hover {
        background: var(--rr-orange-hover);
      }
      a.go:focus-visible {
        outline: 3px solid var(--rr-yellow);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" role="img" aria-label="Re:Rise"></div>
      <h1>Pagina nu există</h1>
      <p>Page not found.</p>
      <a class="go" href="/eq-simulator/">Înapoi la simulator · Back to the simulator</a>
    </main>
  </body>
</html>
